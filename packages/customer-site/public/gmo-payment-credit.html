<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GMOペイメントゲートウェイ - クレジットカード決済</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css">
    <script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        
        /* GMO風ヘッダー */
        .gmo-header {
            background: #003da5;
            color: white;
            padding: 20px;
            border-radius: 10px 10px 0 0;
            text-align: center;
        }
        .gmo-logo {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 5px;
        }
        .gmo-subtitle {
            font-size: 0.9rem;
            opacity: 0.9;
        }
        
        /* メインコンテンツ */
        .payment-container {
            background: white;
            padding: 30px;
            border-radius: 0 0 10px 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .order-info {
            background: #f8f9fa;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
        }
        .order-info-title {
            font-size: 1rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            border-bottom: 2px solid #003da5;
            padding-bottom: 8px;
        }
        .order-info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 0.95rem;
        }
        .order-info-label {
            color: #666;
        }
        .order-info-value {
            font-weight: 600;
            color: #333;
        }
        .order-total {
            font-size: 1.2rem;
            color: #d32f2f;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 2px solid #dee2e6;
        }
        
        /* カード入力フォーム */
        .form-section {
            margin-bottom: 25px;
        }
        .form-section-title {
            font-size: 1rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .form-section-title i {
            color: #003da5;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        .form-label {
            display: block;
            font-weight: 500;
            color: #555;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        .required {
            color: #d32f2f;
            margin-left: 4px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #dee2e6;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #003da5;
        }
        
        .card-number-input {
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .card-brands {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .card-brands i {
            font-size: 2rem;
            color: #666;
        }
        
        /* エラーメッセージ */
        .error-message {
            background: #ffebee;
            border: 2px solid #ef5350;
            color: #c62828;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .error-message i {
            margin-right: 8px;
        }
        
        /* ボタン */
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        button {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-cancel {
            background: #6c757d;
            color: white;
        }
        .btn-cancel:hover {
            background: #5a6268;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .btn-submit {
            background: linear-gradient(135deg, #d32f2f 0%, #c62828 100%);
            color: white;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(211, 47, 47, 0.4);
        }
        .btn-submit:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        /* ローディング */
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        .loading.show {
            display: block;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #003da5;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* セキュリティ情報 */
        .security-info {
            background: #e3f2fd;
            border-left: 4px solid #1976d2;
            padding: 15px;
            margin-top: 20px;
            border-radius: 4px;
            font-size: 0.85rem;
            color: #0d47a1;
            line-height: 1.6;
        }
        .security-info i {
            margin-right: 8px;
            color: #1976d2;
        }
        
        /* フッター */
        .gmo-footer {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            color: #666;
            font-size: 0.85rem;
        }
        .gmo-footer-logo {
            font-weight: 600;
            color: #003da5;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="container">
            <!-- GMOヘッダー -->
            <div class="gmo-header">
                <div class="gmo-logo">
                    <i class="fas fa-shield-alt"></i> GMO ペイメントゲートウェイ
                </div>
                <div class="gmo-subtitle">安全なクレジットカード決済</div>
            </div>
            
            <!-- メインコンテンツ -->
            <div class="payment-container">
                <!-- 注文情報 -->
                <div class="order-info">
                    <div class="order-info-title">
                        <i class="fas fa-receipt"></i> ご注文内容
                    </div>
                    <div class="order-info-row">
                        <span class="order-info-label">予約番号</span>
                        <span class="order-info-value">{{ bookingNumber }}</span>
                    </div>
                    <div class="order-info-row">
                        <span class="order-info-label">イベント名</span>
                        <span class="order-info-value">{{ eventName }}</span>
                    </div>
                    <div class="order-info-row">
                        <span class="order-info-label">参加日</span>
                        <span class="order-info-value">{{ participationDate }}</span>
                    </div>
                    <div class="order-info-row order-total">
                        <span class="order-info-label">お支払い金額</span>
                        <span class="order-info-value">¥{{ totalAmount.toLocaleString() }}</span>
                    </div>
                </div>
                
                <!-- エラーメッセージ -->
                <div class="error-message" :class="{ show: errorMessage }">
                    <i class="fas fa-exclamation-circle"></i>
                    {{ errorMessage }}
                </div>
                
                <!-- ローディング -->
                <div class="loading" :class="{ show: isProcessing }">
                    <div class="spinner"></div>
                    <div>決済処理中です。しばらくお待ちください...</div>
                </div>
                
                <!-- カード入力フォーム -->
                <template v-if="!isProcessing">
                    <div class="form-section">
                        <div class="form-section-title">
                            <i class="fas fa-credit-card"></i>
                            クレジットカード情報
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">
                                カード番号 <span class="required">*</span>
                            </label>
                            <input 
                                type="text" 
                                v-model="cardInfo.number" 
                                placeholder="1234 5678 9012 3456"
                                maxlength="19"
                                class="card-number-input"
                                @input="formatCardNumber">
                            <div class="card-brands">
                                <i class="fab fa-cc-visa"></i>
                                <i class="fab fa-cc-mastercard"></i>
                                <i class="fab fa-cc-jcb"></i>
                                <i class="fab fa-cc-amex"></i>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">
                                カード名義人 <span class="required">*</span>
                            </label>
                            <input 
                                type="text" 
                                v-model="cardInfo.holderName" 
                                placeholder="TARO YAMADA"
                                style="text-transform: uppercase;">
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">
                                    有効期限 <span class="required">*</span>
                                </label>
                                <select v-model="cardInfo.expMonth">
                                    <option value="">月</option>
                                    <option v-for="m in 12" :key="m" :value="String(m).padStart(2, '0')">
                                        {{ String(m).padStart(2, '0') }}
                                    </option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label" style="opacity: 0;">年</label>
                                <select v-model="cardInfo.expYear">
                                    <option value="">年</option>
                                    <option v-for="y in 10" :key="y" :value="2024 + y">
                                        {{ 2024 + y }}
                                    </option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">
                                セキュリティコード (CVV) <span class="required">*</span>
                            </label>
                            <input 
                                type="text" 
                                v-model="cardInfo.cvv" 
                                placeholder="123"
                                maxlength="4"
                                style="width: 120px;">
                        </div>
                    </div>
                    
                    <!-- セキュリティ情報 -->
                    <div class="security-info">
                        <i class="fas fa-lock"></i>
                        このページはSSL暗号化通信により保護されています。カード情報は安全に処理されます。
                    </div>
                    
                    <!-- ボタン -->
                    <div class="button-group">
                        <button class="btn-cancel" @click="cancelPayment">
                            <i class="fas fa-times"></i> キャンセル
                        </button>
                        <button class="btn-submit" @click="processPayment" :disabled="!isFormValid">
                            <i class="fas fa-lock"></i> 決済する
                        </button>
                    </div>
                </template>
            </div>
            
            <!-- フッター -->
            <div class="gmo-footer">
                <div class="gmo-footer-logo">GMO Payment Gateway, Inc.</div>
                <div>Powered by GMO-PG (ダミー決済画面)</div>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue;
        
        createApp({
            data() {
                return {
                    bookingNumber: '',
                    eventName: '',
                    participationDate: '',
                    totalAmount: 0,
                    cardInfo: {
                        number: '',
                        holderName: '',
                        expMonth: '',
                        expYear: '',
                        cvv: ''
                    },
                    errorMessage: '',
                    isProcessing: false
                };
            },
            computed: {
                isFormValid() {
                    return this.cardInfo.number.replace(/\s/g, '').length >= 13 &&
                           this.cardInfo.holderName.length > 0 &&
                           this.cardInfo.expMonth &&
                           this.cardInfo.expYear &&
                           this.cardInfo.cvv.length >= 3;
                }
            },
            methods: {
                loadPaymentInfo() {
                    // URLパラメータから情報を取得
                    const params = new URLSearchParams(window.location.search);
                    this.bookingNumber = params.get('booking_number') || 'BK20240218001';
                    this.eventName = params.get('event_name') || '東京1日観光ツアー';
                    this.participationDate = params.get('date') || '2024年3月15日';
                    this.totalAmount = parseInt(params.get('amount') || '15000');
                },
                
                formatCardNumber() {
                    // カード番号を4桁ごとにスペース挿入
                    let value = this.cardInfo.number.replace(/\s/g, '');
                    let formatted = value.match(/.{1,4}/g)?.join(' ') || value;
                    this.cardInfo.number = formatted;
                },
                
                async processPayment() {
                    this.errorMessage = '';
                    
                    // バリデーション
                    if (!this.isFormValid) {
                        this.errorMessage = 'すべての必須項目を入力してください';
                        return;
                    }
                    
                    // カード番号の簡易バリデーション
                    const cardNumber = this.cardInfo.number.replace(/\s/g, '');
                    if (cardNumber.length < 13 || cardNumber.length > 19) {
                        this.errorMessage = 'カード番号が正しくありません';
                        return;
                    }
                    
                    // 処理開始
                    this.isProcessing = true;
                    
                    // ダミー処理: 2秒待機
                    await new Promise(resolve => setTimeout(resolve, 2000));
                    
                    // 成功: コールバックURLへリダイレクト
                    const callbackUrl = `/payment-callback?` +
                        `booking_number=${this.bookingNumber}&` +
                        `status=success&` +
                        `payment_method=credit_card&` +
                        `transaction_id=TXN${Date.now()}&` +
                        `amount=${this.totalAmount}`;
                    
                    window.location.href = callbackUrl;
                },
                
                cancelPayment() {
                    if (confirm('決済をキャンセルしてよろしいですか？')) {
                        const callbackUrl = `/payment-callback?` +
                            `booking_number=${this.bookingNumber}&` +
                            `status=cancelled&` +
                            `payment_method=credit_card`;
                        
                        window.location.href = callbackUrl;
                    }
                }
            },
            mounted() {
                this.loadPaymentInfo();
            }
        }).mount('#app');
    </script>
</body>
</html>
