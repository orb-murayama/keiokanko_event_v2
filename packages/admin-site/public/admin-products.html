<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品管理 | 管理画面</title>
  
  <!-- CSS読み込み（適切な順序で） -->
  <link rel="stylesheet" href="/static/css/reset.css">
  <link rel="stylesheet" href="/static/css/variables.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/admin.css">
  <link rel="stylesheet" href="/static/css/utilities.css">
  <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css" rel="stylesheet">
  <!-- u7ba1u7406u753bu9762u8a8du8a3cu30c1u30a7u30c3u30af -->
  <script src="/static/js/admin-auth.js"></script>
  <script src="/js/components/common-header.js"></script>
</head>
<body>
<!-- パンくずリスト -->
  <div class="container" style="margin-top: 1rem;">
    <div class="breadcrumb" style="font-size: 0.875rem; color: #6b7280;">
      <a href="/admin" style="color: #3b82f6;">管理画面</a> &gt; 
      <a href="/admin/products" style="color: #3b82f6;">商品一覧</a>
    </div>
  </div>

  <!-- メインコンテンツ -->
  <main class="container">
    <div class="admin-card">
      <!-- ヘッダー -->
      <div class="card-header">
        <h2 class="card-title">商品一覧</h2>
        <a href="/admin/products/new" class="btn btn-primary">
          <i class="fas fa-plus"></i> 新規商品登録
        </a>
      </div>

      <!-- 検索フォーム -->
      <form id="searchForm" class="search-form">
        <div class="form-row">
          <div class="form-group">
            <label for="searchName" class="form-label">商品名</label>
            <input type="text" id="searchName" class="form-control" placeholder="商品名で検索">
          </div>
          <div class="form-group">
            <label for="searchEventId" class="form-label">イベント</label>
            <select id="searchEventId" class="form-control">
              <option value="">すべてのイベント</option>
            </select>
          </div>
          <div class="form-group">
            <label for="searchStatus" class="form-label">状態</label>
            <select id="searchStatus" class="form-control">
              <option value="">すべて</option>
              <option value="1">販売中</option>
              <option value="0">停止中</option>
            </select>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">
            <i class="fas fa-search"></i> 検索
          </button>
          <button type="button" id="resetBtn" class="btn btn-secondary">
            <i class="fas fa-redo"></i> リセット
          </button>
        </div>
      </form>

      <!-- 読み込み中 -->
      <div id="loading" class="hidden">読み込み中...</div>
      
      <!-- エラーメッセージ -->
      <div id="errorMessage" class="hidden"></div>

      <!-- 商品テーブル -->
      <div class="table-container">
        <table class="admin-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>画像</th>
              <th>商品名</th>
              <th>イベント</th>
              <th>価格</th>
              <th>状態</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="productsTableBody">
            <tr>
              <td colspan="7" class="text-center">読み込み中...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- ページネーション -->
      <div id="pagination" class="pagination hidden">
        <div class="pagination-info">
          <span id="paginationInfo">全 0 件中 0 - 0 件を表示</span>
        </div>
        <div class="pagination-buttons">
          <button id="prevPage" class="btn btn-secondary" disabled>
            <i class="fas fa-chevron-left"></i> 前へ
          </button>
          <button id="nextPage" class="btn btn-secondary" disabled>
            次へ <i class="fas fa-chevron-right"></i>
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- フッター -->
  <footer class="admin-footer">
    <div class="container">
      <p>&copy; 2025 イベント予約管理システム</p>
    </div>
  </footer>

  <!-- JavaScript -->
  <script src="/static/js/modules/utils.js"></script>
  <script src="/static/js/pages/admin.js"></script>
  <script src="/static/js/pages/admin-products.js?v=20260209"></script>
</body>
</html>
