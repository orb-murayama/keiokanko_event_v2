<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">共有在庫設定 | 管理画面</title>
  <meta name="description" content="商品共有在庫設定 - イベント予約管理システム">
  
  <!-- CSS -->
  <link rel="stylesheet" href="/css/reset.css?v=20260311">
  <link rel="stylesheet" href="/css/variables.css?v=20260311">
  <link rel="stylesheet" href="/css/components.css?v=20260311">
  <link rel="stylesheet" href="/css/admin.css?v=20260311">
  <link rel="stylesheet" href="/css/utilities.css?v=20260311">
  
  <!-- Font Awesome -->
  <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css" rel="stylesheet">
  <!-- 管理画面認証チェック -->
  <script src="/js/admin-auth.js"></script>
  <script src="/js/components/common-header.js"></script>
</head>
<body>
<!-- メインコンテンツ -->
  <main class="admin-main">
    <div class="container">
      <!-- パンくず -->
      <nav class="breadcrumb">
        <a href="/admin">管理画面</a>
        <span class="separator">&gt;</span>
        <a href="/products-list.html">商品管理</a>
        <span class="separator">&gt;</span>
        <span id="productNameBreadcrumb">共有在庫設定</span>
      </nav>

      <!-- ローディング表示 -->
      <div id="loading" class="text-center py-4">
        <i class="fas fa-spinner fa-spin fa-2x text-primary"></i>
        <p class="mt-2 text-muted">読み込み中...</p>
      </div>

      <!-- エラー表示 -->
      <div id="error" class="alert alert-danger" style="display: none;">
        <i class="fas fa-exclamation-circle"></i>
        <span id="errorMessage">エラーが発生しました</span>
      </div>

      <!-- 商品情報カード -->
      <div id="productInfo" class="card mb-4" style="display: none;">
        <div class="card-header">
          <h2 class="card-title">
            <i class="fas fa-box"></i>
            商品情報
          </h2>
        </div>
        <div class="card-body">
          <div class="form-row mb-4">
            <div class="form-group">
              <p class="text-muted text-sm mb-1">商品名</p>
              <p class="font-semibold text-lg" id="productName">-</p>
            </div>
            <div class="form-group">
              <p class="text-muted text-sm mb-1">商品ID</p>
              <p class="font-semibold text-lg" id="productIdDisplay">-</p>
            </div>
          </div>
        </div>
      </div>

      <!-- 共有在庫追加フォーム -->
      <div id="addSharedStockFormContainer" class="card mb-4" style="display: none;">
        <div class="card-header">
          <h2 class="card-title">
            <i class="fas fa-plus-circle"></i>
            共有在庫を追加
          </h2>
        </div>
        <div class="card-body">
          <form id="addSharedStockForm">
            <div class="form-row">
              <div class="form-group">
                <label for="poolName" class="form-label required">共有在庫プール</label>
                <select id="poolName" name="poolName" class="form-input" required>
                  <option value="">選択してください</option>
                </select>
              </div>
              <div class="form-group">
                <label for="priceBand" class="form-label required">価格帯</label>
                <select id="priceBand" name="priceBand" class="form-input" required>
                  <option value="">選択してください</option>
                </select>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="dateStart" class="form-label required">開始日</label>
                <input type="date" id="dateStart" name="dateStart" class="form-input" required>
              </div>
              <div class="form-group">
                <label for="dateEnd" class="form-label required">終了日</label>
                <input type="date" id="dateEnd" name="dateEnd" class="form-input" required>
              </div>
            </div>

            <div class="form-row single-column">
              <div class="form-group">
                <label for="stockName" class="form-label">表示名（オプション）</label>
                <input type="text" id="stockName" name="stockName" class="form-input" 
                       placeholder="例: バス座席">
                <small class="form-helper">
                  <i class="fas fa-info-circle"></i>
                  商品ページで表示される在庫名を設定できます
                </small>
              </div>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn btn-primary">
                <i class="fas fa-plus"></i>
                共有在庫を追加
              </button>
              <button type="button" id="resetBtn" class="btn btn-secondary">
                <i class="fas fa-redo"></i>
                リセット
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- 現在の共有在庫設定 -->
      <div class="card mb-4">
        <div class="card-header">
          <h2 class="card-title">
            <i class="fas fa-list"></i>
            設定済み共有在庫
          </h2>
        </div>
        <div class="card-body">
          <div id="stocksLoading" class="text-center py-4">
            <i class="fas fa-spinner fa-spin fa-2x text-primary"></i>
            <p class="mt-2 text-muted">読み込み中...</p>
          </div>

          <div id="stocksError" class="alert alert-danger" style="display: none;">
            <i class="fas fa-exclamation-circle"></i>
            <span id="stocksErrorMessage">エラーが発生しました</span>
          </div>

          <div id="stocksTableContainer" style="display: none;">
            <div class="table-responsive">
              <table class="table">
                <thead>
                  <tr>
                    <th>プール名</th>
                    <th>日付</th>
                    <th>時間帯</th>
                    <th class="text-center">価格帯</th>
                    <th class="text-center">利用可能</th>
                    <th>表示名</th>
                    <th class="text-center">操作</th>
                  </tr>
                </thead>
                <tbody id="sharedStocksTable">
                  <!-- JavaScriptで動的生成 -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- フッター -->
  <footer class="admin-footer">
    <div class="container">
      <p>&copy; 2025 イベント予約管理システム</p>
    </div>
  </footer>

  <!-- JavaScript -->
  <script src="/js/modules/api.js?v=20260311"></script>
  <script src="/js/modules/utils.js?v=20260311"></script>
  <script src="/js/pages/admin.js?v=20260311"></script>
  <script src="/js/pages/admin-products-shared-stocks.js?v=20260311"></script>
</body>
</html>
