<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">アカウント登録 | 管理画面</title>
  
  <!-- CSS読み込み（適切な順序で） -->
  <link rel="stylesheet" href="/static/css/reset.css?v=20260217-004">
  <link rel="stylesheet" href="/static/css/variables.css?v=20260217-004">
  <link rel="stylesheet" href="/static/css/components.css?v=20260217-004">
  <link rel="stylesheet" href="/static/css/admin.css?v=20260217-004">
  <link rel="stylesheet" href="/static/css/utilities.css?v=20260217-004">
  <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css" rel="stylesheet">
  <!-- u7ba1u7406u753bu9762u8a8du8a3cu30c1u30a7u30c3u30af -->
  <script src="/static/js/admin-auth.js"></script>
  <script src="/js/components/common-header.js"></script>
</head>
<body>
<!-- メインコンテンツ -->
  <main class="container">
    <div class="admin-card">
      <h1 id="headerText" class="card-title">アカウント登録</h1>
      <form id="accountForm">
        <input type="hidden" id="accountId" name="accountId">
        <input type="hidden" id="mode" name="mode">

        <!-- 基本情報 -->
        <div class="form-section">
          <h2 class="form-section-title">
            <i class="fas fa-info-circle"></i>
            基本情報
          </h2>
          
          <div class="form-row">
            <div class="form-group">
              <label for="login_id" class="form-label">
                <span class="text-danger">*</span> ログインID
              </label>
              <input type="text" id="login_id" name="login_id" class="form-control" 
                     placeholder="例: user001" required>
            </div>

            <div class="form-group">
              <label for="password" class="form-label">
                <span id="passwordLabel"></span> パスワード
              </label>
              <input type="password" id="password" name="password" class="form-control" 
                     placeholder="パスワードを入力">
              <small class="form-hint" id="passwordHint"></small>
            </div>
            
            <div class="form-group">
              <label for="person_name" class="form-label">
                <span class="text-danger">*</span> 担当者名
              </label>
              <input type="text" id="person_name" name="person_name" class="form-control" 
                     placeholder="例: 山田 太郎" required>
            </div>

            <div class="form-group">
              <label for="email" class="form-label">
                <span class="text-danger">*</span> メールアドレス
              </label>
              <input type="email" id="email" name="email" class="form-control" 
                     placeholder="例: user@example.com" required>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="tel" class="form-label">電話番号</label>
              <input type="tel" id="tel" name="tel" class="form-control" 
                     placeholder="例: 03-1234-5678">
            </div>

            <div class="form-group">
              <label for="mobile" class="form-label">携帯電話</label>
              <input type="tel" id="mobile" name="mobile" class="form-control" 
                     placeholder="例: 090-1234-5678">
            </div>
          </div>
        </div>

        <!-- 所属情報 -->
        <div class="form-section">
          <h2 class="form-section-title">
            <i class="fas fa-building"></i>
            所属情報
          </h2>

          <div class="form-row">
            <div class="form-group">
              <label for="account_type" class="form-label">
                <span class="text-danger">*</span> アカウントタイプ
              </label>
              <select id="account_type" name="account_type" class="form-control" required>
                <option value="">選択してください</option>
                <option value="keio">京王観光</option>
                <option value="client">クライアント</option>
              </select>
            </div>

            <div class="form-group">
              <label for="role" class="form-label">
                <span class="text-danger">*</span> 権限レベル
              </label>
              <select id="role" name="role" class="form-control" required>
                <option value="">選択してください</option>
                <option value="system_admin">システム管理者</option>
                <option value="admin">本社管理者</option>
                <option value="branch">支店担当者</option>
                <option value="client">クライアント</option>
              </select>
            </div>
          </div>

          <!-- 主所属支店（account_type=keio かつ role=branch の時のみ表示） -->
          <div class="form-row" id="primary_branch_section" style="display: none;">
            <div class="form-group">
              <label for="primary_branch_code" class="form-label">
                <span id="primaryBranchRequired"></span> 主所属支店
              </label>
              <select id="primary_branch_code" name="primary_branch_code" class="form-control">
                <option value="">選択してください</option>
              </select>
            </div>
          </div>

          <!-- 追加アクセス権限（account_type=keio かつ role=branch の時のみ表示） -->
          <div class="form-group" id="accessible_branches_section" style="display: none;">
            <label class="form-label">追加アクセス権限（複数選択可）</label>
            <div id="accessible_branches_checkboxes" class="checkbox-group"></div>
            <small class="form-hint">主所属支店以外でアクセス可能な支店を選択してください</small>
          </div>

          <!-- 所属クライアント（account_type=client の時のみ表示） -->
          <div class="form-row" id="client_section" style="display: none;">
            <div class="form-group">
              <label for="client_id" class="form-label">
                <span id="clientRequired"></span> 所属クライアント
              </label>
              <select id="client_id" name="client_id" class="form-control">
                <option value="">選択してください</option>
              </select>
            </div>
          </div>
        </div>

        <!-- アカウント状態 -->
        <div class="form-section">
          <h2 class="form-section-title">
            <i class="fas fa-toggle-on"></i>
            アカウント状態
          </h2>

          <div class="form-row">
            <div class="form-group">
              <label class="form-checkbox">
                <input type="checkbox" id="enable_flg" name="enable_flg" checked>
                <span>アカウントを有効にする</span>
              </label>
            </div>

            <div class="form-group">
              <label for="expiration_date" class="form-label">有効期限</label>
              <input type="date" id="expiration_date" name="expiration_date" class="form-control">
              <small class="form-hint">空欄の場合は無期限</small>
            </div>
          </div>
        </div>

        <!-- アクションボタン -->
        <div class="form-actions">
          <button type="submit" id="submitBtn" class="btn btn-primary">
            <i class="fas fa-save"></i>
            登録する
          </button>
          <a href="/admin/accounts" class="btn btn-secondary">
            <i class="fas fa-times"></i>
            キャンセル
          </a>
        </div>
      </form>
    </div>
  </main>

  <!-- フッター -->
  <footer class="admin-footer">
    <div class="container">
      <p>&copy; 2025 イベント予約管理システム</p>
    </div>
  </footer>

  <!-- JavaScript -->
  <script src="/static/js/modules/api.js"></script>
  <script src="/static/js/modules/utils.js"></script>
  <script src="/static/js/pages/admin.js"></script>
  <script src="/static/js/pages/admin-account-edit.js"></script>
</body>
</html>
