  /api/events:
    get:
      summary: イベント一覧取得（統合版 - 認証オプショナル）
      description: |
        イベントの一覧を検索・ページネーション付きで取得
        
        **認証**: オプショナル（Cookieベースのセッション）
        - 認証なし: 公開項目のみ（有効・削除されていないイベントのみ）
        - 認証あり（admin）: 管理画面用項目を追加（削除済みイベント含む）
        
        **日付形式**: YYYY/MM/DD（例: 2024/08/01）
        
        **レスポンスフィールド**:
        - 常に返却: id, name, detail, location, branch_code, branch_name, branch_full_name, client_id, client_name, event_start_date, event_end_date など
        - 認証時のみ: organizer_id, contact, admin_email, enable_flg, deleted_at など
      tags:
      - イベント管理
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 1
        description: ページ番号
      - name: per_page
        in: query
        schema:
          type: integer
          default: 50
        description: 1ページあたりの件数
      - name: name
        in: query
        schema:
          type: string
        description: イベント名（部分一致）
      - name: branch_code
        in: query
        schema:
          type: string
        description: 支店コード
      - name: client_id
        in: query
        schema:
          type: integer
        description: クライアントID
      - name: vendor_id
        in: query
        schema:
          type: integer
        description: 仕入先ID
      - name: event_start_date_from
        in: query
        schema:
          type: string
          format: date
        description: 開始日（FROM）
      - name: event_start_date_to
        in: query
        schema:
          type: string
          format: date
        description: 開始日（TO）
      - name: enable_flg
        in: query
        schema:
          type: integer
          enum: [0, 1]
        description: 有効フラグ（認証時のみ有効）
      - name: category
        in: query
        schema:
          type: string
        description: カテゴリ
      - name: event_type
        in: query
        schema:
          type: string
        description: イベントタイプ
      - name: include_deleted
        in: query
        schema:
          type: integer
          enum: [0, 1]
        description: 削除済み含む（認証時のみ有効）
      - name: sort
        in: query
        schema:
          type: string
          enum: [id, name, event_start_date, created_at]
          default: id
        description: ソートカラム
      - name: order
        in: query
        schema:
          type: string
          enum: [asc, desc]
          default: desc
        description: ソート順
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        detail:
                          type: string
                        location:
                          type: string
                        branch_code:
                          type: string
                          description: 支店コード（例: TOKYO）
                        branch_name:
                          type: string
                          description: 支店名（例: 東京）
                        branch_full_name:
                          type: string
                          description: 支店正式名（例: 東京支店）
                        client_id:
                          type: integer
                          description: クライアントID
                        client_name:
                          type: string
                          description: クライアント名（例: 株式会社テストクライアント）
                        event_start_date:
                          type: string
                          format: date
                          description: 開始日（YYYY/MM/DD）
                        event_end_date:
                          type: string
                          format: date
                          description: 終了日（YYYY/MM/DD）
                        registration_start_date:
                          type: string
                          format: date-time
                        registration_end_date:
                          type: string
                          format: date-time
                        category:
                          type: string
                        enable_flg:
                          type: integer
                          description: 有効フラグ（認証時のみ）
                        organizer_id:
                          type: integer
                          nullable: true
                          description: 主催者ID（認証時のみ、現在非表示）
                        contact:
                          type: string
                          description: 連絡先（認証時のみ）
                  pagination:
                    type: object
                    properties:
                      total:
                        type: integer
                      per_page:
                        type: integer
                      current_page:
                        type: integer
                      last_page:
                        type: integer
        '400':
          description: リクエストエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookieAuth: []
      - {}
    post:
      summary: イベント新規登録
      description: 新しいイベントを登録
      tags:
      - イベント管理
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: リクエストエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 認証エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookieAuth: []
