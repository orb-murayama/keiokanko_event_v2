openapi: 3.0.3
info:
  title: イベント予約管理システム 管理画面API
  description: |
    管理画面（HTML5版）で使用するAPI仕様書
    
    ## v2.2.0 更新内容 (2026-02-05)
    **イベント管理API整理と支店・クライアント情報追加**:
    - GET /api/events: 認証オプショナルで支店・クライアント情報を返却
    - 未使用エンドポイント削除（products, options, children, group, products-all, options-by-date, parents/list）
    - イベントコピー、カテゴリ取得エンドポイント追加
    - イベント一覧の日付形式をYYYY/MM/DD形式に統一
    
    ## v2.1.0 更新内容 (2026-01-23)
    **入力フォーム項目設定の移動**: イベント管理から商品管理へ完全移動
    
    ### API変更
    - ❌ 削除: GET/POST /api/events/{id}/form-fields (event_form_fields廃止)
    - ✅ 追加: GET/POST /api/products/{id}/form-fields (product_form_fields新設)
    
    ### データベース変更
    - ✅ productsテーブルにform_field_settingsカラム追加（TEXT型、JSON形式）
      - 7つの入力項目: 氏名（漢字）、氏名（カナ）、氏名（ローマ字）、住所、電話番号、生年月日、年齢
    - ✅ product_form_fieldsテーブル追加（商品別カスタムフォーム項目）
    - ✅ booking_form_responsesにproduct_idカラム追加
    - ❌ event_form_fieldsテーブル削除
    
    ### 理由
    予約フォームの項目設定を商品単位で管理する要件変更。同一イベント内で商品ごとに異なるフォーム項目を設定可能に。
