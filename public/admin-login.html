<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理画面ログイン | イベント予約管理システム</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 450px;
            width: 100%;
            padding: 3rem;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .login-header .icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            font-size: 2.5rem;
            color: white;
        }
        
        .login-header h1 {
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 0.5rem;
        }
        
        .login-header p {
            color: #666;
            font-size: 0.9rem;
        }
        
        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .step {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: #999;
            transition: all 0.3s;
        }
        
        .step.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            transform: scale(1.1);
        }
        
        .step.completed {
            background: #10b981;
            color: white;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #555;
            font-weight: 500;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .otp-input {
            text-align: center;
            font-size: 1.5rem;
            letter-spacing: 0.5rem;
            font-weight: 600;
        }
        
        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        .info-message {
            background: #e3f2fd;
            color: #1976d2;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            display: none;
        }
        
        .info-message.show {
            display: block;
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #f3f4f6;
            color: #666;
            margin-top: 0.5rem;
        }
        
        .btn-secondary:hover:not(:disabled) {
            background: #e5e7eb;
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .timer {
            text-align: center;
            margin-top: 1rem;
            color: #666;
            font-size: 0.9rem;
        }
        
        .timer.warning {
            color: #f57c00;
            font-weight: 600;
        }
        
        #emailStep {
            display: block;
        }
        
        #otpStep {
            display: none;
        }
        
        .dev-note {
            background: #fff3cd;
            border: 1px solid #ffc107;
            color: #856404;
            padding: 12px;
            border-radius: 8px;
            margin-top: 1rem;
            font-size: 0.85rem;
        }
        
        .dev-note strong {
            display: block;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="icon">
                <i class="fas fa-shield-alt"></i>
            </div>
            <h1>管理画面ログイン</h1>
            <p>ワンタイムパスワード認証</p>
        </div>
        
        <div class="step-indicator">
            <div class="step active" id="step1">1</div>
            <div class="step" id="step2">2</div>
        </div>
        
        <div class="error-message" id="errorMessage"></div>
        <div class="info-message" id="infoMessage"></div>
        
        <!-- Step 1: メールアドレス入力 -->
        <div id="emailStep">
            <div class="form-group">
                <label for="email">
                    <i class="fas fa-envelope"></i> メールアドレス
                </label>
                <input type="email" id="email" placeholder="admin@example.com" autocomplete="email">
            </div>
            
            <button class="btn btn-primary" id="sendOtpBtn">
                <i class="fas fa-paper-plane"></i> ワンタイムパスワードを送信
            </button>
            
            <div class="dev-note">
                <strong><i class="fas fa-info-circle"></i> 開発モード</strong>
                ワンタイムパスワードはブラウザのコンソールに出力されます。<br>
                本番環境ではメールで送信されます。
            </div>
        </div>
        
        <!-- Step 2: OTP入力 -->
        <div id="otpStep">
            <div class="form-group">
                <label for="otpCode">
                    <i class="fas fa-key"></i> ワンタイムパスワード（6桁）
                </label>
                <input type="text" id="otpCode" class="otp-input" placeholder="000000" maxlength="6" autocomplete="off">
            </div>
            
            <div class="timer" id="timer">
                有効期限: <span id="countdown">10:00</span>
            </div>
            
            <button class="btn btn-primary" id="verifyOtpBtn">
                <i class="fas fa-sign-in-alt"></i> ログイン
            </button>
            
            <button class="btn btn-secondary" id="resendOtpBtn">
                <i class="fas fa-redo"></i> 再送信
            </button>
        </div>
    </div>
    
    <script>
        let email = '';
        let countdownInterval = null;
        let expiresAt = null;
        
        // エラーメッセージ表示
        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = message;
            errorEl.classList.add('show');
            setTimeout(() => errorEl.classList.remove('show'), 5000);
        }
        
        // 情報メッセージ表示
        function showInfo(message) {
            const infoEl = document.getElementById('infoMessage');
            infoEl.textContent = message;
            infoEl.classList.add('show');
            setTimeout(() => infoEl.classList.remove('show'), 5000);
        }
        
        // ステップ切り替え
        function switchToStep(step) {
            if (step === 1) {
                document.getElementById('emailStep').style.display = 'block';
                document.getElementById('otpStep').style.display = 'none';
                document.getElementById('step1').classList.add('active');
                document.getElementById('step2').classList.remove('active');
            } else {
                document.getElementById('emailStep').style.display = 'none';
                document.getElementById('otpStep').style.display = 'block';
                document.getElementById('step1').classList.remove('active');
                document.getElementById('step1').classList.add('completed');
                document.getElementById('step2').classList.add('active');
            }
        }
        
        // カウントダウン開始
        function startCountdown() {
            if (countdownInterval) {
                clearInterval(countdownInterval);
            }
            
            countdownInterval = setInterval(() => {
                const now = new Date().getTime();
                const expires = new Date(expiresAt).getTime();
                const remaining = expires - now;
                
                if (remaining <= 0) {
                    clearInterval(countdownInterval);
                    document.getElementById('countdown').textContent = '期限切れ';
                    document.getElementById('timer').classList.add('warning');
                    showError('ワンタイムパスワードの有効期限が切れました。再送信してください。');
                    return;
                }
                
                const minutes = Math.floor(remaining / 60000);
                const seconds = Math.floor((remaining % 60000) / 1000);
                document.getElementById('countdown').textContent = 
                    `${minutes}:${seconds.toString().padStart(2, '0')}`;
                
                if (remaining < 60000) {
                    document.getElementById('timer').classList.add('warning');
                }
            }, 1000);
        }
        
        // OTP送信
        async function sendOtp() {
            const emailInput = document.getElementById('email').value.trim();
            
            if (!emailInput) {
                showError('メールアドレスを入力してください');
                return;
            }
            
            // メールアドレス形式チェック
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(emailInput)) {
                showError('メールアドレスの形式が正しくありません');
                return;
            }
            
            const btn = document.getElementById('sendOtpBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 送信中...';
            
            try {
                const response = await axios.post('/api/admin/auth/send-otp', {
                    email: emailInput
                });
                
                email = emailInput;
                expiresAt = response.data.expires_at;
                
                // 開発モード: OTPをコンソールとアラートで表示
                if (response.data.dev_otp) {
                    console.log('='.repeat(60));
                    console.log('📧 ワンタイムパスワード（開発モード）');
                    console.log('='.repeat(60));
                    console.log(`メールアドレス: ${email}`);
                    console.log(`OTPコード: ${response.data.dev_otp}`);
                    console.log(`有効期限: ${new Date(expiresAt).toLocaleString('ja-JP')}`);
                    console.log('='.repeat(60));
                    
                    alert(`開発モード\n\nワンタイムパスワード: ${response.data.dev_otp}\n\n※ 本番環境ではメールで送信されます`);
                }
                
                showInfo('ワンタイムパスワードを送信しました（コンソールを確認してください）');
                switchToStep(2);
                startCountdown();
                
                // OTP入力欄にフォーカス
                document.getElementById('otpCode').focus();
                
            } catch (error) {
                console.error('OTP送信エラー:', error);
                showError(error.response?.data?.error || 'OTPの送信に失敗しました');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> ワンタイムパスワードを送信';
            }
        }
        
        // OTP検証
        async function verifyOtp() {
            const otpCode = document.getElementById('otpCode').value.trim();
            
            if (!otpCode) {
                showError('ワンタイムパスワードを入力してください');
                return;
            }
            
            if (otpCode.length !== 6) {
                showError('ワンタイムパスワードは6桁です');
                return;
            }
            
            const btn = document.getElementById('verifyOtpBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 確認中...';
            
            try {
                const response = await axios.post('/api/admin/auth/verify-otp', {
                    email: email,
                    code: otpCode
                });
                
                // セッショントークンはCookieに自動保存される（httpOnly）
                // レスポンスからは削除されている
                
                showInfo('ログインに成功しました。管理画面へ移動します...');
                
                // リダイレクト先を取得（クエリパラメータから）
                const urlParams = new URLSearchParams(window.location.search);
                const redirectUrl = urlParams.get('redirect') || '/admin-dashboard.html';
                
                // 管理画面へリダイレクト
                setTimeout(() => {
                    window.location.href = redirectUrl;
                }, 1000);
                
            } catch (error) {
                console.error('OTP検証エラー:', error);
                showError(error.response?.data?.error || 'ログインに失敗しました');
                document.getElementById('otpCode').value = '';
                document.getElementById('otpCode').focus();
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> ログイン';
            }
        }
        
        // イベントリスナー
        document.getElementById('sendOtpBtn').addEventListener('click', sendOtp);
        document.getElementById('verifyOtpBtn').addEventListener('click', verifyOtp);
        document.getElementById('resendOtpBtn').addEventListener('click', () => {
            switchToStep(1);
            document.getElementById('otpCode').value = '';
            document.getElementById('email').value = email;
            if (countdownInterval) {
                clearInterval(countdownInterval);
            }
        });
        
        // Enterキーでフォーム送信
        document.getElementById('email').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendOtp();
        });
        
        document.getElementById('otpCode').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') verifyOtp();
        });
        
        // 数字のみ入力可能
        document.getElementById('otpCode').addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^0-9]/g, '');
        });
    </script>
</body>
</html>
