<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一括メッセージ登録 | 管理画面</title>
  
  <!-- CSS読み込み -->
  <link rel="stylesheet" href="/static/css/reset.css">
  <link rel="stylesheet" href="/static/css/variables.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/admin.css">
  <link rel="stylesheet" href="/static/css/utilities.css">
  <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css" rel="stylesheet">
  <!-- u7ba1u7406u753bu9762u8a8du8a3cu30c1u30a7u30c3u30af -->
  <script src="/static/js/admin-auth.js"></script>
  <script src="/js/components/common-header.js"></script>
</head>
<body>
<!-- メインコンテンツ -->
  <main class="container">
    <!-- 戻るボタン -->
    <div class="mb-3">
      <a href="/admin/bookings" class="btn btn-secondary">
        <i class="fas fa-arrow-left"></i> 予約一覧に戻る
      </a>
    </div>

    <!-- アップロードフォーム -->
    <div class="admin-card">
      <div class="card-header">
        <h2 class="card-title">CSVファイルアップロード</h2>
      </div>
      <div class="card-body">
        <form id="uploadForm" enctype="multipart/form-data">
          <!-- CSVファイル選択 -->
          <div class="form-group">
            <label for="csvFile" class="form-label">
              <i class="fas fa-file-csv"></i> CSVファイル
            </label>
            <input type="file" id="csvFile" name="csv_file" accept=".csv" class="form-control" required>
            <small class="form-text">
              ※ CSV形式: 予約番号,メールアドレス,タイトル,メッセージ,送信日時（YYYY/MM/DD HH:MM）<br>
              ※ 最大1000行まで<br>
              ※ 1行目はヘッダー行として扱われます
            </small>
          </div>

          <!-- マイページ表示設定 -->
          <div class="form-group">
            <div class="form-check">
              <input type="checkbox" id="displayOnMypage" name="display_on_mypage" value="1" class="form-check-input" checked>
              <label for="displayOnMypage" class="form-check-label">
                マイページのお客様通信欄に表示する
              </label>
            </div>
          </div>

          <!-- ボタン -->
          <div class="form-actions">
            <button type="button" id="previewBtn" class="btn btn-secondary">
              <i class="fas fa-eye"></i> プレビュー
            </button>
            <button type="submit" id="uploadBtn" class="btn btn-primary">
              <i class="fas fa-upload"></i> 一括登録
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- プレビュー -->
    <div id="previewSection" class="admin-card hidden">
      <div class="card-header">
        <h2 class="card-title">プレビュー</h2>
      </div>
      <div class="card-body">
        <div id="previewContent"></div>
      </div>
    </div>

    <!-- 登録結果 -->
    <div id="resultSection" class="admin-card hidden">
      <div class="card-header">
        <h2 class="card-title">登録結果</h2>
      </div>
      <div class="card-body">
        <div id="resultContent"></div>
      </div>
    </div>

    <!-- ローディング -->
    <div id="loading" class="hidden">
      <i class="fas fa-spinner fa-spin"></i> 処理中...
    </div>
  </main>

  <!-- JavaScript読み込み -->
  <script src="/static/js/utils.js"></script>
  <script src="/static/js/pages/admin-bulk-messages.js"></script>
</body>
</html>
