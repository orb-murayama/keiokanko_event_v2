<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>予約管理 | 管理画面</title>
  
  <!-- CSS読み込み（適切な順序で） -->
  <link rel="stylesheet" href="/static/css/reset.css">
  <link rel="stylesheet" href="/static/css/variables.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/admin.css">
  <link rel="stylesheet" href="/static/css/utilities.css">
  <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css" rel="stylesheet">
  <!-- u7ba1u7406u753bu9762u8a8du8a3cu30c1u30a7u30c3u30af -->
  <script src="/static/js/admin-auth.js"></script>
  <script src="/js/components/common-header.js"></script>
</head>
<body>
<!-- メインコンテンツ -->
  <main class="container">
    <div class="admin-card">
      <!-- ヘッダー -->
      <div class="card-header">
        <h2 class="card-title">予約一覧</h2>
        <div style="display: flex; gap: 10px;">
          <a href="/admin-bulk-emails.html" class="btn btn-info">
            <i class="fas fa-envelope"></i> 一括メール送信
          </a>
          <a href="/admin-bulk-documents.html" class="btn btn-danger" style="background-color: #dc3545; color: white; font-weight: 600;">
            <i class="fas fa-file-pdf"></i> 帳票一括生成
          </a>
          <a href="/admin-bulk-messages.html" class="btn btn-primary">
            <i class="fas fa-envelope-open-text"></i> 一括メッセージ登録
          </a>
          <button id="exportCsvBtn" class="btn btn-success">
            <i class="fas fa-file-csv"></i> CSV出力
          </button>
        </div>
      </div>

      <!-- 検索フォーム -->
      <form id="searchForm" class="search-form">
        <div class="form-row">
          <div class="form-group">
            <label for="searchEventId" class="form-label">イベント</label>
            <select id="searchEventId" class="form-control">
              <option value="">すべて</option>
            </select>
          </div>
          <div class="form-group">
            <label for="searchClientId" class="form-label">クライアント</label>
            <select id="searchClientId" class="form-control">
              <option value="">すべて</option>
            </select>
          </div>
          <div class="form-group">
            <label for="searchBranchCode" class="form-label">担当支店</label>
            <input type="text" id="searchBranchCode" class="form-control" placeholder="支店コード">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="searchBookingNumber" class="form-label">予約番号</label>
            <input type="text" id="searchBookingNumber" class="form-control" placeholder="予約番号で検索">
          </div>
          <div class="form-group">
            <label for="searchBookingStatus" class="form-label">予約ステータス</label>
            <select id="searchBookingStatus" class="form-control">
              <option value="">すべて</option>
              <option value="reserved">予約済み</option>
              <option value="confirmed">確定</option>
              <option value="canceled">キャンセル</option>
            </select>
          </div>
          <div class="form-group">
            <label for="searchPaymentStatus" class="form-label">支払いステータス</label>
            <select id="searchPaymentStatus" class="form-control">
              <option value="">すべて</option>
              <option value="pending">未払い</option>
              <option value="completed">完了</option>
              <option value="failed">失敗</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="searchCreatedAtFrom" class="form-label">予約日（開始）</label>
            <input type="date" id="searchCreatedAtFrom" class="form-control">
          </div>
          <div class="form-group">
            <label for="searchCreatedAtTo" class="form-label">予約日（終了）</label>
            <input type="date" id="searchCreatedAtTo" class="form-control">
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">
            <i class="fas fa-search"></i> 検索
          </button>
          <button type="button" id="resetBtn" class="btn btn-secondary">
            <i class="fas fa-redo"></i> リセット
          </button>
        </div>
      </form>

      <!-- 読み込み中 -->
      <div id="loading" class="hidden">読み込み中...</div>

      <!-- テーブル -->
      <div class="table-responsive">
        <table class="admin-table">
          <thead>
            <tr>
              <th>予約番号</th>
              <th>イベント名</th>
              <th>商品名</th>
              <th>顧客名</th>
              <th>金額</th>
              <th>予約ステータス</th>
              <th>支払いステータス</th>
              <th>予約日時</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="bookingsTableBody">
            <!-- データはJavaScriptで動的に挿入 -->
          </tbody>
        </table>
      </div>

      <!-- ページネーション -->
      <div id="pagination" class="pagination hidden"></div>
    </div>
  </main>

  <!-- フッター -->
  <footer class="admin-footer">
    <div class="container">
      <p>&copy; 2024 イベント予約管理システム. All rights reserved.</p>
    </div>
  </footer>

  <!-- JavaScript -->
  <script src="/static/js/modules/api.js"></script>
  <script src="/static/js/modules/utils.js"></script>
  <script src="/static/js/pages/admin.js"></script>
  <script src="/static/js/pages/admin-bookings.js"></script>
</body>
</html>
